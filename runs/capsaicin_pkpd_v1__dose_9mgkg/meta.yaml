  before tissue_overrides are applied
- brain is included as a mandatory CNS tissue and currently uses a spinal_coord proxy
  histamine profile until a source-backed brain profile is introduced
- capsaicin pulse H(t) peak parameters are stated explicitly in YAML and aligned with
  the current scenario_registry defaults
- skin h_base_nm is fixed explicitly at 10 nM; with the configured pulse amplitude
  of 900 nM this yields a marker-tissue peak of about 910 nM around stimulus onset
- k_deg implicitly equals k_synth per ODE mass-balance invariant
- XC7 concentration-time profiles are interpolated from the configured XLSX source
  using time=linear, dose=log-linear, extrapolation=clip, species=rat, regimen=single,
  dose=9 mg/kg, administration_lag_h=0.
