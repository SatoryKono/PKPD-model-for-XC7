runtime_assumptions:
- canonical scenario_id formalin is used directly
- shared/common trafficking and top-level formalin_profile act as deterministic defaults
  before tissue_overrides, including tissue-specific profile_shape, are applied
- brain is included as a mandatory CNS tissue and currently uses a spinal_coord proxy
  profile until a source-backed brain profile is introduced
- formalin skin phase-1 half-life of 9 min is approximated as gaussian sigma_min=7.6
- phase-2 skin peak is encoded via formalin_profile amplitude override to reach 400
  nM on a 50 nM baseline
- spinal_coord and ganglia phase centers are fixed at 30/120 min and 15/60 min respectively
  because the source table specifies peaks and t1/2 but not phase timing
- k_deg implicitly equals k_synth per ODE mass-balance invariant
- XC7 concentration-time profiles are interpolated from the configured XLSX source
  using time=linear, dose=log-linear, extrapolation=clip, species=rat, regimen=single,
  dose=90 mg/kg.
