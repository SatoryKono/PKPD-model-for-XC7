solver_metadata:
  solver_method: LSODA
  rtol: 0.001
  atol: 1.0e-06
  max_step: null
runtime_assumptions:
- canonical scenario_id cyp_cystitis; baseline H(t) gaussian_sum per tissue is in
  scenario_registry when YAML omits phase overrides
- optional cyp_cystitis_profile and tissue_overrides.<tissue>.formalin_profile override
  phase1/phase2 (amplitude_nm, center_min, sigma_min); top-level profile applies the
  same phase merge to every tissue, so organ-specific peaks belong in tissue_overrides
- simulation horizon 0-24 h with 5 min spacing; late-phase histamine gaussians are
  encoded for longer horizons but contribute negligibly within 24 h
- brain H(t) uses a dedicated registry profile (not spinal_coord proxy)
- XC7 PK for bladder uses organ column peritoneum from SINGLE_REP_pred_mice_rats.xlsx
  via antagonist_pk.tissue_map
- bladder receptor-traffic parameters use peritoneum-like visceral proxy from the
  scenario parameter table
- top-level trafficking is merged with shared/common.yaml then overridden per tissue
- k_deg implicitly equals k_synth per ODE mass-balance invariant
- XC7 concentration-time profiles are interpolated from the configured XLSX source
  using time=linear, dose=log-linear, extrapolation=clip, species=rat, regimen=single,
  dose=36 mg/kg, administration_lag_h=0.
antagonist_pk:
  enabled: true
  source_xlsx: examples\configs\shared\SINGLE_REP_pred_mice_rats.xlsx
  sheet_name: 0
  species: rat
  regimen: single
  dose_mg_per_kg: 36.0
  concentration_column: C_nM
  administration_lag_h: 0.0
  tissue_map:
    skin: skin
    muscle: muscles
    spinal_coord: spinal cord
    brain: brain
    ganglia: sympathetic ganglia
    peritoneum: peritoneum
    bladder: peritoneum
  method_time: linear
  method_dose: log-linear
  extrapolation: clip
  allow_single_dose_scaling: false
