# Общие параметры trafficking, используемые как базовые defaults.
trafficking:
  # Максимальная скорость интернализации рецептора, 1/ч; эквивалентный t1/2 ≈ 0.55 ч (≈ 33.3 мин).
  k_int_max_per_h: 1.25
  # Скорость возврата рецептора на мембрану, 1/ч; эквивалентный t1/2 ≈ 1.39 ч (≈ 83.2 мин).
  k_rec_per_h: 0.5
  # Скорость синтеза/восстановления пула рецепторов, 1/ч; эквивалентный t1/2 ≈ 13.86 ч (≈ 831.8 мин).
  k_synth_per_h: 0.05
  # EC50 для beta-arrestin ветки, нМ.
  ec50_barr_nm: 750.0
  # Kb конкурентного антагонизма XC7 для arrestin/internalization ветки, нМ.
  kb_arr_nm: 1000
  # Коэффициент Хилла для сигнальных веток.
  hill_n: 1.0
  # EC50 для G-белкового пути, нМ.
  ec50_g_nm: 40.0
  # Kb конкурентного антагонизма XC7 для G-белкового пути, нМ.
  kb_g_nm: 6000.0
  # Конститутивная активность H3R как доля от Emax (0.05 = 5%).
  constitutive_activity: 0.05
  # Базальная концентрация гистамина, нМ.
  h_base_nm: 10.0

# Общий контракт расчета концентрации XC7 по внешней PK-таблице.
antagonist_pk:
  # Включает расчет тканевой концентрации XC7 и экспорт в simulation.csv.
  enabled: true
  # Внешний XLSX-источник предсказанных PK-концентраций по tissue/species/regimen.
  source_xlsx: "examples/configs/shared/SINGLE_REP_pred_mice_rats.xlsx"
  # В исходной задаче используется однократное введение.
  regimen: single
  # Выбранная доза XC7 для графиков и export-контура.
  # Каноническая единица экспорта — nM, поэтому используется колонка C_nM.
  concentration_column: C_nM
  # Лаг между индукцией модели (time_h=0) и введением XC7.
  administration_lag_h: 0.0
  # Параметры интерполяции/экстраполяции согласованы с pk_model.py.
  method_time: linear
  method_dose: log-linear
  extrapolation: clip
  # Явный mapping тканей модели на organ из XLSX.
  tissue_map:
    skin: skin
    muscle: muscles
    spinal_coord: spinal cord
    brain: brain
    ganglia: sympathetic ganglia
    peritoneum: peritoneum
    bladder: peritoneum

