model_id: cyp_cystitis_rats_histamine_h3
compound: xc7
species: rat
loss_mode: mse

traceability:
  source_in_report: "Scenario matrix row: cyp_cystitis"
  source_reference: "Frontiers Vet Sci 2024; ICS 2015 abstract; Ahluwalia 1994; IUPHAR GtoP H3 receptor"
  source_version: "2026-04-08"

assumptions:
  - "canonical scenario_id cyp_cystitis; baseline H(t) gaussian_sum per tissue is in scenario_registry when YAML omits phase overrides"
  - "optional cyp_cystitis_profile and tissue_overrides.<tissue>.formalin_profile override phase1/phase2 (amplitude_nm, center_min, sigma_min); top-level profile applies the same phase merge to every tissue, so organ-specific peaks belong in tissue_overrides"
  - "simulation horizon 0-24 h with 5 min spacing; late-phase histamine gaussians are encoded for longer horizons but contribute negligibly within 24 h"
  - "brain H(t) uses a dedicated registry profile (not spinal_coord proxy)"
  - "XC7 PK for bladder uses organ column peritoneum from SINGLE_REP_pred_mice_rats.xlsx via antagonist_pk.tissue_map"
  - "bladder receptor-traffic parameters use peritoneum-like visceral proxy from the scenario parameter table"
  - "top-level trafficking is merged with shared/common.yaml then overridden per tissue"

shared_configs:
  - ../shared/common.yaml

driver:
  driver_type: scenario
  scenario_id: cyp_cystitis

cyp_cystitis_profile:
  profile_shape: gaussian_sum

 

tissue_overrides:
  bladder:
    
    
     
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 10.0
        center_min: 0.0
        sigma_min: 10.0
      phase2:
        amplitude_nm: 50.0
        center_min: 300.0
        sigma_min: 100.0
  spinal_coord:
     
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 20.0
        center_min: 240.0
        sigma_min: 360.0
      phase2:
        amplitude_nm: 15.0
        center_min: 360.0
        sigma_min: 360.0
  brain:
     
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 1.0
        center_min: 480.0
        sigma_min: 240.0
      phase2:
        amplitude_nm: 1.0
        center_min: 10080.0
        sigma_min: 5760.0
  ganglia:
     
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 12.0
        center_min: 240.0
        sigma_min: 120.0
      phase2:
        amplitude_nm: 15.0
        center_min: 10080.0
        sigma_min: 2880.0

tissues:
  - bladder
  - spinal_coord
  - ganglia
  - brain

