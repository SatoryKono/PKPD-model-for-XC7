model_id: compound_48_80_pkpd_v1
compound: xc7
species: mouse
loss_mode: mse

traceability:
  source_in_report: "Scenario matrix row: compound 48/80"
  source_reference: ""
  source_version: "2026-04-06"

assumptions:
  - "canonical scenario_id compound_48_80 is used directly"
  - "skin two-phase profile and CNS profiles are taken from scenario_registry as the source of truth"
  - "brain is included as a mandatory CNS tissue and currently uses a spinal_coord proxy profile until a source-backed brain profile is introduced"
  - "top-level trafficking acts as deterministic defaults before tissue_overrides are applied"
  - "legacy file examples/configs/compound48_80.yaml is retained only as a compatibility example"

shared_configs:
  - ../shared/common.yaml

driver:
  driver_type: scenario
  scenario_id: compound_48_80
antagonist_pk:
  administration_lag_h: -1.0

tissue_overrides:
  skin:
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 1500.0
        center_min: 5.0
        sigma_min: 30.0
      phase2:
        amplitude_nm: 200.0
        center_min: 120.0
        sigma_min: 180.0
    trafficking:
      h_base_nm: 10.0

  spinal_coord:
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 10.0
        center_min: 60.0
        sigma_min: 120.0
    trafficking:
      h_base_nm: 5.0

  ganglia:
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 5.0
        center_min: 20.0
        sigma_min: 15.0
    trafficking:
      h_base_nm: 10.0

  brain:
    formalin_profile:
      profile_shape: gaussian_sum
      phase1:
        amplitude_nm: 0.4
        center_min: 120.0
        sigma_min: 80.0
    trafficking:
      h_base_nm: 2.0

tissues:
  - skin
  - ganglia
  - spinal_coord
  - brain
    
