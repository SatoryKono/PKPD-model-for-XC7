# Expected marker_points.csv (first 3 lines):
# time_h,plasma_concentration_nM,marker
# 0.0,250.0,baseline
# 1.0,210.5,peak_decline

model_id: capsaicin_pkpd_v1
compound: capsaicin
loss_mode: huber
assumptions:
  - one_compartment_absorption_model
  - first_order_elimination
traceability:
  source_in_report: "Capsaicin pilot in-vivo study, report table 2"
  source_reference: "doi:10.0000/example-capsaicin"
  source_version: "2026-01"
time_grid: [0, 30, 60, 120, 240]
time_unit: min
initial_concentration: 0.25
concentration_unit: uM
kinetics:
  k_abs: 0.08
  k_elim: 0.015
  rate_unit: 1/min
tissues:
  - name: plasma
    volume: 2.5
    volume_unit: L
    partition_coeff: 1.0
  - name: skin
    volume: 1.2
    volume_unit: L
    partition_coeff: 3.6
plots:
  - id: plasma_curve
    title: Plasma concentration over time
    plot_type: line
    x: time
    y: plasma_concentration
    x_unit: min
    y_unit: uM
scenario_assumptions:
  dermal_absorption_multiplier: 1.15
