[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkpd-model-xc7"
version = "0.2.0"
description = "Deterministic PKPD receptor-trafficking simulation toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PKPD Model Team" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-regtest>=0.5",
]

[project.scripts]
pkpd-cli = "src.cli.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "regression_data: тесты с внешним report_v12_extracted (могут xfail/skip)",
  "snapshot: снапшоты pytest-regtest (нужен пакет pytest-regtest)",
  "integration: интеграция API/CLI и файловой системы",
]
norecursedirs = [".git", ".venv", "venv", "env", "dist", "build", "*.egg-info"]
